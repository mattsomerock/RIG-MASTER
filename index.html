<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIG MASTER - Realtime Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- HEADER SECTION -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-5">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <i data-lucide="activity" class="text-blue-500"></i> RIG MASTER - REALTIME DASHBOARD
                </h1>
                <p class="text-xs text-slate-400 mt-1">
                    ระบบเฝ้าระวังและวิเคราะห์พอร์ตการลงทุน Master Account
                </p>
            </div>

            <div class="flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-800">
                <div id="statusDot" class="w-3 h-3 rounded-full bg-rose-500"></div>
                <div>
                    <div id="statusText" class="text-xs font-semibold uppercase tracking-wider text-slate-300">
                        DISCONNECTED
                    </div>
                    <div id="syncTime" class="text-[10px] text-slate-500">Sync: -</div>
                </div>
            </div>
        </header>

        <!-- METRICS CARDS -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            
            <!-- BALANCE -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-medium uppercase tracking-wider">Balance</span>
                    <i data-lucide="wallet" class="w-4 h-4 text-blue-400"></i>
                </div>
                <div id="valBalance" class="text-2xl font-extrabold text-white">$0.00</div>
            </div>

            <!-- EQUITY -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-medium uppercase tracking-wider">Equity</span>
                    <i data-lucide="activity" class="w-4 h-4 text-indigo-400"></i>
                </div>
                <div id="valEquity" class="text-2xl font-extrabold text-white">$0.00</div>
            </div>

            <!-- FLOATING PNL -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-medium uppercase tracking-wider">Floating P&L</span>
                    <i data-lucide="trending-up" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div id="valPnl" class="text-2xl font-extrabold text-slate-200">$0.00</div>
            </div>

            <!-- MARGIN LEVEL -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-medium uppercase tracking-wider">Margin Level</span>
                    <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div id="valMargin" class="text-2xl font-extrabold text-amber-300">0.0%</div>
            </div>

        </div>

        <!-- GEMINI SPARK WIDGET SECTION -->
        <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-indigo-500/30 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-indigo-500/10 rounded-xl border border-indigo-500/20 text-indigo-400">
                        <i data-lucide="sparkles" class="w-5 h-5 animate-pulse"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            Gemini Spark AI Analyst
                        </h2>
                        <p class="text-xs text-slate-400">ระบบวิเคราะห์สรุปความเสี่ยงและสภาวะพอร์ตด้วย AI</p>
                    </div>
                </div>

                <button
                    id="btnAnalyze"
                    class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-medium rounded-xl text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20"
                >
                    <i data-lucide="cpu" class="w-4 h-4"></i> วิเคราะห์สภาวะพอร์ต
                </button>
            </div>

            <!-- API KEY INPUT -->
            <div class="mb-4">
                <input
                    type="password"
                    id="geminiKeyInput"
                    placeholder="กรอก Gemini API Key ของคุณที่นี่..."
                    class="w-full bg-slate-950/80 border border-slate-800 focus:border-indigo-500 text-xs text-slate-200 px-4 py-2.5 rounded-xl outline-none transition-all"
                />
            </div>

            <!-- ERROR ALERT -->
            <div id="aiError" class="hidden p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-300 text-xs items-center gap-2 mb-4">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="aiErrorText"></span>
            </div>

            <!-- AI RESULT DISPLAY -->
            <div id="aiResult" class="hidden p-5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">
            </div>
        </div>

    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://rig-master-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let masterData = null;

        // 1. Listen เฉพาะ Master Account เท่านั้น
        const masterRef = ref(db, 'accounts/master');
        onValue(masterRef, (snapshot) => {
            if (snapshot.exists()) {
                masterData = snapshot.val();
                updateDashboardUI(masterData);
                setConnectionStatus(true);
            } else {
                setConnectionStatus(false);
            }
        }, (err) => {
            console.error("Firebase Error:", err);
            setConnectionStatus(false);
        });

        function setConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const sync = document.getElementById('syncTime');

            if (connected) {
                dot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                text.innerText = "MASTER ONLINE";
                sync.innerText = "Sync: " + new Date().toLocaleTimeString();
            } else {
                dot.className = "w-3 h-3 rounded-full bg-rose-500";
                text.innerText = "DISCONNECTED";
            }
        }

        function updateDashboardUI(data) {
            document.getElementById('valBalance').innerText = '$' + (data.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('valEquity').innerText = '$' + (data.equity || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            const pnl = data.pnl || 0;
            const pnlEl = document.getElementById('valPnl');
            pnlEl.innerText = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
            pnlEl.className = `text-2xl font-extrabold ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            const margin = data.margin_level || 0;
            document.getElementById('valMargin').innerText = margin ? margin.toFixed(1) + '%' : 'N/A';
        }

        // 2. Gemini Spark AI Logic
        const keyInput = document.getElementById('geminiKeyInput');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const aiError = document.getElementById('aiError');
        const aiErrorText = document.getElementById('aiErrorText');
        const aiResult = document.getElementById('aiResult');

        // Load saved API Key
        if (localStorage.getItem('GEMINI_API_KEY')) {
            keyInput.value = localStorage.getItem('GEMINI_API_KEY');
        }

        keyInput.addEventListener('input', (e) => {
            localStorage.setItem('GEMINI_API_KEY', e.target.value.trim());
        });

        btnAnalyze.addEventListener('click', async () => {
            const apiKey = keyInput.value.trim();

            aiError.classList.add('hidden');
            aiError.classList.remove('flex');
            aiResult.classList.add('hidden');

            if (!apiKey) {
                showError('กรุณากรอก Gemini API Key ก่อนเริ่มวิเคราะห์');
                return;
            }

            if (!masterData) {
                showError('ยังไม่มีข้อมูลพอร์ต Master จากระบบ');
                return;
            }

            btnAnalyze.disabled = true;
            btnAnalyze.innerHTML = `<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i> กำลังวิเคราะห์...`;
            lucide.createIcons();

            try {
                // ใช้ Endpoint รุ่นล่าสุด gemini-1.5-flash
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                const prompt = `คุณคือ AI วิเคราะห์สภาวะพอร์ตการลงทุนชื่อ "Gemini Spark"
วิเคราะห์ข้อมูลพอร์ตการเทรด MT5 (Master Account) ต่อไปนี้ และสรุปสถานะสั้นๆ กระชับ เป็นมืออาชีพ (ตอบเป็นภาษาไทย):

- Equity: $${masterData.equity}
- Balance: $${masterData.balance}
- Floating PnL: $${masterData.pnl}
- Margin Level: ${masterData.margin_level}%
- Leverage: ${masterData.leverage || '1:500'}

โครงสร้างคำตอบ:
1. 📊 **สรุปสภาวะภาพรวม** (1-2 ประโยค)
2. ⚠️ **ระดับความเสี่ยงปัจจุบัน** (ประเมินจาก Margin Level และ Floating PnL)
3. 💡 **คำแนะนำสำหรับการบริหารพอร์ต** (1-2 ข้อ)`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const responseData = await response.json();

                if (!response.ok) {
                    throw new Error(responseData.error?.message || `HTTP Error ${response.status}`);
                }

                const generatedText = responseData.candidates?.[0]?.content?.parts?.[0]?.text;
                if (generatedText) {
                    const formattedHtml = generatedText.replace(/\n/g, '<br>');
                    aiResult.innerHTML = `<div class="text-indigo-400 font-semibold text-xs uppercase tracking-wider mb-3 flex items-center gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4"></i> บทวิเคราะห์ล่าสุด</div>` + formattedHtml;
                    aiResult.classList.remove('hidden');
                    lucide.createIcons();
                } else {
                    throw new Error('ไม่พบข้อมูลตอบกลับจาก Gemini API');
                }

            } catch (err) {
                showError(err.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อกับ Gemini API');
            } finally {
                btnAnalyze.disabled = false;
                btnAnalyze.innerHTML = `<i data-lucide="cpu" class="w-4 h-4"></i> วิเคราะห์สภาวะพอร์ต`;
                lucide.createIcons();
            }
        });

        function showError(msg) {
            aiErrorText.innerText = msg;
            aiError.classList.remove('hidden');
            aiError.classList.add('flex');
        }
    </script>

    <!-- Render Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
